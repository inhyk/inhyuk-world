<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c9eaff"><title>구름 점프 · 2D 점프맵</title><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="game" tabindex="0" aria-label="2D 점프맵. 방향키 또는 A D로 이동, 스페이스로 점프"></canvas>
<header><a href="/" target="_top" aria-label="게임 목록으로">← 게임 세계</a><div class="brand">☁ 구름 점프 <span>2D</span></div><button id="pause" aria-label="일시정지">Ⅱ</button><button id="sound" aria-pressed="false" aria-label="소리 켜기">소리 OFF</button></header>
<aside class="hud"><div><small>STAGE <b id="stage">01 / 10</b></small><strong id="name">첫 구름</strong><div class="track"><i id="progress"></i></div></div><div class="numbers"><span>★ <b id="stars">0</b><small>/ 50</small></span><span>시간 <b id="time">0:00</b></span><span>넘어짐 <b id="deaths">0</b></span></div></aside>
<div id="toast" role="status"></div>
<p class="hint">← → / A D 이동 <i>·</i> SPACE 점프 <i>·</i> R 체크포인트 <i>·</i> P 일시정지</p>
<nav class="touch" aria-label="게임 조작"><div><button data-key="left" aria-label="왼쪽 이동">◀</button><button data-key="right" aria-label="오른쪽 이동">▶</button></div><button data-key="jump" class="jump">점프 ↑</button></nav>
<section id="overlay"><div class="panel"><p class="eyebrow">A LITTLE ADVENTURE ABOVE THE CLOUDS</p><div class="cloud-icon">☁</div><h1>구름 <em>점프</em></h1><p id="intro">한 칸씩, 하늘 끝까지.<br>10개의 코스를 넘어 반짝이는 별을 모아요.</p><div class="badges"><span>✦ 별 50개</span><span>⚑ 체크포인트</span><span>↔ 움직이는 발판</span></div><button id="play" class="primary">모험 시작하기 →</button><p class="guide" id="guide">방향키로 이동 · 스페이스로 점프<br>떨어져도 마지막 깃발에서 다시 시작해요.</p><p id="best"></p></div></section>
<script type="module" src="game.mjs"></script></body></html>
