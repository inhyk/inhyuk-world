<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2559eb"><title>DASH / OVERDRIVE</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="world" tabindex="0" aria-label="대쉬 오버드라이브. 스페이스 또는 터치로 점프, 비행 중 누르면 상승합니다."></canvas>
<header><a href="/" target="_top" class="brand">D<span>↗</span><small>OVERDRIVE<br>ORIGINAL ARCADE</small></a><div class="tools"><a class="classic-link" href="/play/dash-overdrive/classic" target="_top">CLASSIC 1~15 ↗</a><button id="sound" aria-pressed="false" aria-label="소리 켜기">♫ OFF</button><button id="pause" aria-label="일시정지">Ⅱ</button><button id="full" aria-label="전체 화면">⛶</button></div></header>
<div class="hud" id="hud" hidden><div><b id="track-name">SKYLINE</b><span id="form">CUBE MODE</span></div><div class="meter"><i id="progress"></i></div><b id="percent">0%</b><span id="gems">◆ 0</span></div>
<main id="menu"><div class="eyebrow"><i></i> HARDER. FASTER. NO LIMITS.</div><h1>DASH<span>OVERDRIVE<span class="arrow">↗</span></span></h1><p class="lead">뛰어넘고. 날아오르고.<br>더 빠르게, 더 좁게. 한계를 돌파해.</p><div class="menu-actions"><button id="play" class="play">시작하기 <span>↗</span></button><label><input type="checkbox" id="practice"> 연습 모드 <small>체크포인트</small></label></div><div class="controls"><span>SPACE / 클릭 / 터치</span> 점프 <b>·</b> 비행 중 꾹 누르면 상승</div><section class="tracks" aria-label="코스 선택"><button data-track="0" class="selected" aria-pressed="true"><small>01 / HARD</small><strong>SKYLINE <span>↗</span></strong><em>하늘 도시 <b>BEST 0%</b></em></button><button data-track="1" aria-pressed="false"><small>02 / EXPERT</small><strong>AFTERGLOW <span>↗</span></strong><em>노을 속으로 <b>BEST 0%</b></em></button><button data-track="2" aria-pressed="false"><small>03 / INSANE</small><strong>HYPERSPACE <span>↗</span></strong><em>우주 돌파 <b>BEST 0%</b></em></button></section></main>
