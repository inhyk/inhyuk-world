<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#39c2ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect x=%2212%22 y=%2240%22 width=%2276%22 height=%2228%22 rx=%2214%22 fill=%22%23ff4d5e%22/%3E%3Ccircle cx=%2230%22 cy=%2272%22 r=%2213%22 fill=%22%23222%22/%3E%3Ccircle cx=%2270%22 cy=%2272%22 r=%2213%22 fill=%22%23222%22/%3E%3Ccircle cx=%2250%22 cy=%2230%22 r=%2216%22 fill=%22%23ffd23e%22/%3E%3C/svg%3E">
<title>씽씽 카트 · 드리프트 레이싱</title>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="씽씽 카트 게임 화면. 방향키로 운전하고 Shift 로 드리프트, Ctrl 로 아이템을 씁니다."></canvas>

<div id="lobby">
  <header>
    <h1>씽씽 카트</h1>
    <p class="sub">드리프트로 부스터를 모으고 1등으로 달려요!</p>
    <div class="top-right">
      <span class="coin"><i></i><b id="l-coins">0</b></span>
      <button id="b-sound" title="소리" aria-label="소리 켜고 끄기">🔊</button>
      <button id="b-music" title="음악" aria-label="음악 켜고 끄기">🎵</button>
    </div>
  </header>
  <section class="col left">
    <h2>트랙</h2>
    <div id="l-tracks" class="tracks"></div>
  </section>
  <section class="col right">
    <h2>경기 방식</h2>
    <div id="l-modes" class="seg"></div>
    <div id="l-diffs" class="seg small"></div>
    <h2>선수</h2>
    <div id="l-racers" class="grid"></div>
    <h2>카트</h2>
    <div id="l-karts" class="karts"></div>
    <button id="b-start" class="big">출발! 🏁</button>
    <button id="b-online" class="big blue">👫 친구랑 같이 하기</button>
    <p class="keys">← → 운전 · ↑ 달리기 · ↓ 멈추기 · <b>Shift</b> 드리프트 · <b>Ctrl</b> 또는 <b>Z</b> 아이템 · R 트랙으로 돌아오기</p>
  </section>
</div>

<div id="hud" hidden>
  <div class="h-tl">
    <div class="pill"><span>바퀴</span><b id="h-lap">1/3</b></div>
    <div class="pill"><span>시간</span><b id="h-time">0:00.00</b></div>
    <div class="pill dim"><span>최고 한 바퀴</span><b id="h-best">--:--.--</b></div>
    <ol id="h-order"></ol>
  </div>
  <div class="h-tr">
    <div id="h-rank"><b>1</b><span>/8</span></div>
    <canvas id="minimap" width="170" height="170"></canvas>
    <button id="b-pause" aria-label="잠깐 멈추기">⏸</button>
  </div>
  <div class="h-bottom">
    <div id="h-items"><div class="slot"></div><div class="slot"></div></div>
    <div class="speed"><b id="h-speed">0</b><span>km/h</span></div>
    <div id="h-gauge-wrap"><i id="h-gauge"></i><em>부스터 게이지</em></div>
  </div>
  <div id="h-center"></div>
  <div id="h-count"></div>
  <div id="h-wrong" hidden>거꾸로 가고 있어요! ↩︎</div>
  <div id="speedlines"></div>
</div>

<div id="touch" hidden>
  <button id="t-left" aria-label="왼쪽">◀</button>
  <button id="t-right" aria-label="오른쪽">▶</button>
  <button id="t-brake" aria-label="멈추기">멈춤</button>
  <button id="t-item" aria-label="아이템 쓰기">아이템</button>
  <button id="t-drift" aria-label="드리프트">드리프트</button>
</div>

<div id="panel" hidden><div class="box" id="panel-box"></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
